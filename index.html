<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6B21A8" />
    <title>Cardápio Digital</title>
    <meta name="description" content="Peça online direto pelo cardápio digital da loja." />
    <meta property="og:title" content="Cardápio Digital" />
    <meta property="og:description" content="Peça online direto pelo cardápio digital." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Compatibilidade com links antigos do HashRouter (#/loja/carrinho -> /loja/carrinho).
      // Roda antes do bundle para o router já iniciar na rota certa.
      (function () {
        var h = window.location.hash;
        if (h.indexOf("#/") === 0) {
          var alvo = h.slice(1) || "/";
          window.history.replaceState(null, "", alvo + window.location.search);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
